
name: Codespace Auto ON OFF

on:
  workflow_dispatch:
  schedule:
    # 2:00 AM IST - Stop Codespace
    - cron: "30 20 * * *"

    # 7:00 AM IST - Start Codespace
    - cron: "30 1 * * *"

jobs:
  manage:
    runs-on: ubuntu-latest

    steps:
      - name: Stop Codespace at 2 AM                                                                                                                        
    if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CODESPACES_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/codespaces/${{ vars.CODESPACE_NAME }}/stop"

      - name: Start Codespace at 7 AM
        if: github.event.schedule == '30 1 * * *'
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CODESPACES_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/codespaces/${{ vars.CODESPACE_NAME }}/start"

