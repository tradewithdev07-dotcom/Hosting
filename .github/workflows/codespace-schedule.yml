
name: Codespace Auto ON OFF

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"
    - cron: "30 1 * * *"

jobs:
  manage:
    runs-on: ubuntu-latest

    steps:
      - name: Stop Codespace at 2 AM
        if: github.event_name == 'schedule' && github.event.schedule == '30 20 * * *'
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CS_NAME: ${{ vars.CODESPACE_NAME }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/codespaces/$CS_NAME/stop"

      - name: Start Codespace at 7 AM
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '30 1 * * *')
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CS_NAME: ${{ vars.CODESPACE_NAME }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/codespaces/$CS_NAME/start"
